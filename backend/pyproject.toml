[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "auditimi-teknik-bot"
version = "0.1.0"
description = "Albanian Telegram-first civil engineering audit platform"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.6",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2",
  "dramatiq[redis]>=1.17",
  "fastapi>=0.111",
  "jinja2>=3.1",
  "langgraph>=0.2",
  "minio>=7.2",
  "openpyxl>=3.1",
  "pgvector>=0.3",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "python-multipart>=0.0.9",
  "redis>=5.0",
  "sqlalchemy[asyncio]>=2.0",
  "structlog>=24.1",
  "uvicorn[standard]>=0.30",
  "weasyprint>=62.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
ignore_missing_imports = true

