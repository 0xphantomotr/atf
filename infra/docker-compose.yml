services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - postgres
      - redis
      - minio

  worker:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../backend:/app
    command: dramatiq app.workers.jobs --processes 1 --threads 4
    depends_on:
      - postgres
      - redis
      - minio

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: atf
      POSTGRES_USER: atf
      POSTGRES_PASSWORD: atf
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: atf_minio
      MINIO_ROOT_PASSWORD: atf_minio_secret
    command: server /data
    volumes:
      - minio_data:/data

  backup:
    image: alpine:3.20
    restart: unless-stopped
    command: ["sh", "-c", "sleep infinity"]
    depends_on:
      - postgres
      - minio

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  minio_data:
